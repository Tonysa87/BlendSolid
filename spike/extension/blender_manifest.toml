schema_version = "1.0.0"

id = "blendsolid"
version = "0.0.1"
name = "BlendSolid"
tagline = "Exact BRep/NURBS CAD modeling on OpenCASCADE (spike build)"
maintainer = "Antonio Sartini <antonio.sartini@gmail.com>"
type = "add-on"
tags = ["Modeling", "Mesh"]

blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-or-later"]

# Blender 5.x no longer supports Intel macOS; OCP has no Windows ARM wheel.
platforms = ["windows-x64", "linux-x64", "macos-arm64"]

wheels = [
  "./wheels/cadquery_ocp_proxy-8.0.1.0.0-py3-none-any.whl",
  "./wheels/cadquery_ocp_novtk-8.0.1.0.0-cp313-cp313-win_amd64.whl",
  "./wheels/cadquery_ocp_novtk-8.0.1.0.0-cp313-cp313-manylinux_2_28_x86_64.whl",
  "./wheels/cadquery_ocp_novtk-8.0.1.0.0-cp313-cp313-macosx_11_0_arm64.whl",
]

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
